# Values for the upstream LiveKit chart (livekit/livekit-server 1.9.0).
# Site-specific settings (webhook target, Redis) are in values-site.yaml,
# generated by setup.sh. Install with:
#   helm install livekit livekit/livekit-server --version 1.9.0 -n livekit \
#     -f values.yaml -f values-site.yaml
fullnameOverride: livekit-server
replicaCount: 2

image:
  tag: v1.13.10

livekit:
  log_level: info
  # API key/secret come from the "livekit-keys" Secret (see secrets.yaml).
  key_file: keys.yaml
  rtc:
    tcp_port: 7881          # media over TCP (fallback when UDP is blocked)
    udp_port: 7882          # media over UDP, single muxed port
    use_ice_lite: true
    use_external_ip: true   # STUN discovers the node's public IP
    # Drop the chart's default 50000-60000 range; one UDP port is used instead.
    port_range_start: null
    port_range_end: null

storeKeysInSecret:
  enabled: true
  existingSecret: livekit-keys

# Signaling goes through the ingress (plain HTTP to the service on port 80).
loadBalancer:
  type: disable

# Media must reach the node's public IP directly, so pods use the host network.
# This means one LiveKit pod per node (the ports cannot be shared).
podHostNetwork: true

# Spread replicas over different nodes.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: livekit-server
        topologyKey: kubernetes.io/hostname

# Run LiveKit on dedicated nodes (label role=calls, taint calls=true:NoSchedule).
nodeSelector:
  role: calls
tolerations:
  - key: calls
    operator: Equal
    value: "true"
    effect: NoSchedule

resources:
  requests:
    cpu: 1000m
    memory: 1024Mi

serviceMonitor:
  create: false   # set true if the Prometheus Operator is installed
