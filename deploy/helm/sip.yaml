# Optional SIP bridge for outbound phone dialing. Requires Redis (redis.yaml)
# and the livekit-sip Secret from secrets.yaml (generated by setup.sh --sip).
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-sip
  namespace: livekit
data:
  config.yaml: |
    log_level: info
    ws_url: ws://livekit-server.livekit.svc.cluster.local:80
    redis:
      address: livekit-redis.livekit.svc.cluster.local:6379
    sip_port: 5060
    rtp_port: 10000-10100
    use_external_ip: true
    health_port: 8080
    prometheus_port: 6789
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-sip
  namespace: livekit
  labels: {app.kubernetes.io/name: livekit-sip}
spec:
  replicas: 1
  strategy: {type: Recreate}   # host ports: the old pod must stop first
  selector:
    matchLabels: {app.kubernetes.io/name: livekit-sip}
  template:
    metadata:
      labels: {app.kubernetes.io/name: livekit-sip}
    spec:
      enableServiceLinks: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {role: calls}
      tolerations:
        - {key: calls, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: sip
          image: livekit/sip:v1.20.0
          envFrom:
            - secretRef: {name: livekit-sip}   # LIVEKIT_API_KEY, LIVEKIT_API_SECRET
          ports:
            - {name: sip-udp, containerPort: 5060, protocol: UDP}
            - {name: sip-tcp, containerPort: 5060, protocol: TCP}
            - {name: health, containerPort: 8080, protocol: TCP}
            - {name: metrics, containerPort: 6789, protocol: TCP}
          livenessProbe:  {httpGet: {path: /, port: health}}
          readinessProbe: {httpGet: {path: /, port: health}}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /sip/config.yaml, subPath: config.yaml, readOnly: true}
      volumes:
        - name: config
          configMap: {name: livekit-sip}
