# No `redis:` block: it makes LiveKit refuse to start without Redis, which only
# the SIP targets run. They set REDIS_HOST on the container instead, which the
# SIP bridge needs to reach LiveKit.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_ice_lite: true
keys:
  devkey: this-is-a-32-plus-character-dev-secret
# LiveKit POSTs participant/room lifecycle events to the plugin's webhook
# receiver (server/api.go handleLiveKitWebhook), signed with the secret for
# `api_key` below — which must name a key in `keys:` (the plugin verifies with
# the same key/secret). `host.docker.internal` resolves from inside the
# container to the host running `make run-server` (mapped in the compose file so
# it also works on Linux). participant_left is what ends an outbound SIP call on
# phone hang-up or when the last person leaves.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8065/plugins/com.mattermost.calls/livekit-webhook
logging:
  level: info
