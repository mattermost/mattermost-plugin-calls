# Local development only: every config in this folder uses the public `devkey`
# credentials. For a real server, use deploy/compose/ instead.
name: mattermost-calls-livekit-dev
services:
  livekit-dev:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    ports:
      - "7880:7880"       # Signaling (HTTP/WebSocket)
      - "7881:7881"       # WebRTC/TCP media (fallback when UDP is blocked)
      - "7882:7882/udp"   # WebRTC/UDP media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: >
      --config /etc/livekit.yaml
      --node-ip=${LIVEKIT_NODE_IP}
    environment:
      # Empty runs LiveKit without Redis; the SIP make targets set it to redis:6379.
      - REDIS_HOST=${LIVEKIT_REDIS_HOST:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # TLS-terminating reverse proxy for the LiveKit signaling WebSocket.
  # Only needed when external LAN machines connect to an HTTPS Mattermost
  # (a secure page can't open an insecure ws:// signaling socket). Media
  # (7881/7882) is DTLS-SRTP and bypasses this proxy entirely.
  # Started via `make livekit-tls-docker-start`; not part of the plaintext
  # `livekit-docker-start` flow.
  livekit-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "7443:7443"       # wss signaling (TLS) -> livekit-dev:7880
    volumes:
      - ./livekit-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LIVEKIT_TLS_CERT:-/dev/null}:/etc/certs/cert.pem:ro
      - ${LIVEKIT_TLS_KEY:-/dev/null}:/etc/certs/key.pem:ro
    depends_on:
      - livekit-dev

  # --- SIP outbound dialing infra (opt-in via the `sip` profile) ---------------
  # Brought up by `make livekit-sip-docker-start`, which also points livekit-dev
  # at this Redis. These never start on the default `make livekit-docker-start`
  # path.

  # Dedicated Redis for the LiveKit <-> SIP PSRPC bus. Deliberately NOT
  # Mattermost's Redis: avoids an availability dependency on MM's (optional)
  # local Redis and a pub/sub cross-DB collision (Redis pub/sub isn't namespaced
  # by db index).
  redis:
    image: redis:8.10.2-alpine
    profiles: ["sip"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  # LiveKit SIP bridge. Originates outbound INVITEs to the destination set at
  # runtime via the LiveKit API (outbound trunk + dispatch rule) — either the
  # bundled Asterisk sink (`sink` profile) or an external provider.
  livekit-sip:
    image: livekit/sip:v1.20.0
    profiles: ["sip"]
    restart: unless-stopped
    volumes:
      - ./livekit-sip.yaml:/etc/sip.yaml
    command: --config /etc/sip.yaml
    # To dial an EXTERNAL provider instead of the bundled sink, publish the SIP
    # signaling + RTP ports to the host and flip use_external_ip in livekit-sip.yaml:
    # ports:
    #   - "5060:5060/udp"
    #   - "10000-10100:10000-10100/udp"
    depends_on:
      redis:
        condition: service_healthy
      livekit-dev:
        condition: service_started

  # --- Auto-answer SIP sink (opt-in via the `sink` profile) --------------------
  # Brought up by `make livekit-sip-sink-docker-start`. Anonymous auto-answering
  # UAS that Answer()s, plays a greeting, then Echo()s the caller's RTP back to
  # confirm bidirectional media. For human/manual validation only.
  asterisk:
    image: andrius/asterisk:20@sha256:3eeac74ba7ce7981ec43ad552668df02cb2f274f60e3336c1c95bc07d11dd0cc # Asterisk 20.20.1
    profiles: ["sink"]
    restart: unless-stopped
    volumes:
      - ./asterisk-pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk-extensions.conf:/etc/asterisk/extensions.conf:ro
