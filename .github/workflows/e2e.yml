name: E2E Testing

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: "${{ github.run_id }}_playwright_1"
  # Control testing parallelism
  PARALLELISM: 1
  MM_SERVER_IMAGE_TAG: release-12.0

jobs:
  build-mattermost-plugin-calls:
    runs-on: ubuntu-22.04
    steps:
      - name: e2e/checkout-mattermost-plugin-calls-repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: e2e/setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: e2e/setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: e2e/build-mattermost-plugin-calls
        env:
          MM_SERVICESETTINGS_ENABLEDEVELOPER: 1
        run: make dist

      - name: e2e/persist-mattermost-plugin-calls-package
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: mattermost-plugin-calls-package
          path: ${{ github.workspace }}/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-mattermost-plugin-calls-fips:
    # Fork PRs don't get the Chainguard identity secret.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: e2e/checkout-mattermost-plugin-calls-repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: e2e/setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version

      - name: e2e/setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: e2e/build-mattermost-plugin-calls-fips
        uses: mattermost/actions/plugin-ci/build-fips@ec00f39dab9ee31b6dc7f36671d5c8afcf74cc54
        with:
          chainguard-identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: e2e/persist-mattermost-plugin-calls-package-fips
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: mattermost-plugin-calls-package-fips
          path: ${{ github.workspace }}/dist-fips/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  generate-matrix:
    runs-on: ubuntu-22.04
    outputs:
      parallelism-matrix: ${{ steps.calculation.outputs.PARALLELISM }}
      parallelism: ${{ env.PARALLELISM }}
    steps:
      - name: e2e/generate-e2e-matrix
        id: calculation
        run: |
          RANGE=$(( ${{ env.PARALLELISM }}+1 ))
          echo PARALLELISM=$(jq -n "{ run_id: [range(1;${RANGE})]}") > ${GITHUB_OUTPUT}

  e2e-playwright-test:
    runs-on: ubuntu-22.04
    needs:
      - build-mattermost-plugin-calls
      - generate-matrix
    env:
      COMPOSE_PROJECT_NAME: playwright_tests
      DOCKER_NETWORK: playwright_tests
      CONTAINER_SERVER: playwright_tests_server
      CONTAINER_PROXY: playwright_tests_proxy
      CONTAINER_LIVEKIT: playwright_tests_livekit
      CONTAINER_OFFLOADER: playwright_tests_offloader
      IMAGE_CALLS_OFFLOADER: mattermost/calls-offloader:v0.9.6
      IMAGE_CURL: curlimages/curl:8.7.1
      # LiveKit credentials match e2e/docker/livekit.yaml.
      MM_CALLS_LIVE_KIT_URL: ws://livekit:7880
      MM_CALLS_LIVE_KIT_API_KEY: devkey_for_livekit_e2e_ci_tests
      MM_CALLS_LIVE_KIT_API_SECRET: secret_for_livekit_server_ci_e2e_tests
      CI_NODE_INDEX: ${{ matrix.run_id }}
      CI_NODE_TOTAL: ${{ needs.generate-matrix.outputs.parallelism }}
      WORKSPACE: ${{github.workspace}}
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.parallelism-matrix) }}
    steps:
      # The transcriber runs on this host (via calls-offloader) and its whisper
      # build is sensitive to the available CPU instruction sets, so record them.
      - name: e2e/log-runner-cpu
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)
          flags=$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2-)
          avx512=$(echo "${flags}" | tr ' ' '\n' | grep '^avx512' | tr '\n' ' ')
          echo "CPU model: ${model}"
          echo "avx2: $(echo "${flags}" | tr ' ' '\n' | grep -c '^avx2$')  fma: $(echo "${flags}" | tr ' ' '\n' | grep -c '^fma$')  f16c: $(echo "${flags}" | tr ' ' '\n' | grep -c '^f16c$')"
          echo "avx512 flags: ${avx512:-none}"
          echo "all flags:${flags}"
          {
            echo "### Runner CPU"
            echo "- Model: ${model}"
            echo "- AVX-512: ${avx512:-none}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: e2e/checkout-mattermost-plugin-calls-repo
        uses: actions/checkout@v4

      # Compose IMAGE_SERVER from the pinned tag here: the `env` context can't be
      # referenced inside a job-level `env:` block, so we build it via $GITHUB_ENV.
      - name: e2e/set-server-image
        run: echo "IMAGE_SERVER=mattermostdevelopment/mattermost-enterprise-edition:${MM_SERVER_IMAGE_TAG}" >> "${GITHUB_ENV}"

      - name: e2e/checkout-mattermost-repo
        uses: actions/checkout@v4
        with:
          repository: mattermost/mattermost
          # Must match IMAGE_SERVER's tag: this checkout only feeds config
          # generation, so a mismatch would generate config against the wrong
          # server version.
          ref: ${{ env.MM_SERVER_IMAGE_TAG }}
          path: mattermost

      - name: e2e/setup-docker-buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: e2e/setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: mattermost/server/go.mod

      - name: e2e/generate-configuration
        working-directory: ./mattermost/server
        env:
          OUTPUT_CONFIG: ${{ github.workspace }}/config/config.json
        run: |
          go work init . ./public
          mkdir -p ${{ github.workspace }}/config
          cd scripts/config_generator
          go run main.go

      - name: e2e/download-mattermost-plugin-calls-package
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: mattermost-plugin-calls-package
          path: dist

      - name: e2e/docker-login
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        # Do not authenticate on Forks
        if: "! github.event.pull_request.head.repo.fork"
        with:
          username: ${{ secrets.DOCKERHUB_DEV_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DEV_TOKEN }}

      - name: e2e/run-server
        env:
          DOCKER_CLIENT_TIMEOUT: 120
          COMPOSE_HTTP_TIMEOUT: 120
          DOCKER_COMPOSE_FILE: ${{ github.workspace }}/e2e/docker/docker-compose.yaml
          MM_PLUGIN_CALLS_TEST_LICENSE: ${{ secrets.MM_PLUGIN_CALLS_TEST_LICENSE }}
        run: |
          ${{ github.workspace }}/e2e/scripts/prepare-server.sh

      - name: e2e/build-e2e-image
        working-directory: e2e
        run: |
          echo "Building playwright test image ... "
          cp ${{ github.workspace }}/plugin.json plugin.json
          docker build --quiet -t mm-playwright -f Playwright.Dockerfile .

      - name: e2e/test
        env:
          WORKSPACE: ${{github.workspace}}
          RUN_ID: ${{matrix.run_id}}
        id: test
        run: |
          ${{ github.workspace }}/e2e/scripts/run.sh

      - name: e2e/persist-report-results
        if: always()
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: e2e-playwright-results-${{ matrix.run_id }}
          path: ${{ github.workspace }}/results
          compression-level: 0
          retention-days: 1

      - name: e2e/persist-report-logs
        if: ${{ always() && fromJson(steps.test.outputs.FAILURES || '0') > 0 }}
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: e2e-playwright-logs-${{ matrix.run_id }}
          path: ${{ github.workspace }}/logs
          compression-level: 0
          retention-days: 5

  e2e-playwright-test-fips:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    needs:
      - build-mattermost-plugin-calls-fips
      - generate-matrix
    permissions:
      contents: read
      id-token: write
    env:
      EXPECT_FIPS: true
      # Chainguard FIPS builds of the compose services. Postgres runs in FIPS
      # mode, which prepare-server.sh checks.
      IMAGE_LIVEKIT: cgr.dev/mattermost.com/livekit-server-fips:1.13.10@sha256:c83df4199335ada8f05e3fb0505dcc9211318b77de026b15f4682c4017a13a06
      IMAGE_LIVEKIT_SIP: cgr.dev/mattermost.com/livekit-sip-fips:1.20.0@sha256:c4f0084fac602adcbae01056fa075c0abe6eeab84d4b79d91df497f6fdfc1d0c
      IMAGE_REDIS: cgr.dev/mattermost.com/redis-fips:8.10.2@sha256:ebac161fd532aa2065c8722399d5a60a6b807dc70f0999bea752802ffe059c1d
      # IMAGE_POSTGRES is unset: our Chainguard org has no FIPS Postgres image yet.
      COMPOSE_PROJECT_NAME: playwright_tests
      DOCKER_NETWORK: playwright_tests
      CONTAINER_SERVER: playwright_tests_server
      CONTAINER_PROXY: playwright_tests_proxy
      CONTAINER_LIVEKIT: playwright_tests_livekit
      CONTAINER_OFFLOADER: playwright_tests_offloader
      IMAGE_CALLS_OFFLOADER: mattermost/calls-offloader:v0.9.6
      IMAGE_CURL: curlimages/curl:8.7.1
      # LiveKit credentials match e2e/docker/livekit.yaml.
      MM_CALLS_LIVE_KIT_URL: ws://livekit:7880
      MM_CALLS_LIVE_KIT_API_KEY: devkey_for_livekit_e2e_ci_tests
      MM_CALLS_LIVE_KIT_API_SECRET: secret_for_livekit_server_ci_e2e_tests
      CI_NODE_INDEX: ${{ matrix.run_id }}
      CI_NODE_TOTAL: ${{ needs.generate-matrix.outputs.parallelism }}
      WORKSPACE: ${{github.workspace}}
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.parallelism-matrix) }}
    steps:
      # The transcriber runs on this host (via calls-offloader) and its whisper
      # build is sensitive to the available CPU instruction sets, so record them.
      - name: e2e/log-runner-cpu
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)
          flags=$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2-)
          avx512=$(echo "${flags}" | tr ' ' '\n' | grep '^avx512' | tr '\n' ' ')
          echo "CPU model: ${model}"
          echo "avx2: $(echo "${flags}" | tr ' ' '\n' | grep -c '^avx2$')  fma: $(echo "${flags}" | tr ' ' '\n' | grep -c '^fma$')  f16c: $(echo "${flags}" | tr ' ' '\n' | grep -c '^f16c$')"
          echo "avx512 flags: ${avx512:-none}"
          echo "all flags:${flags}"
          {
            echo "### Runner CPU"
            echo "- Model: ${model}"
            echo "- AVX-512: ${avx512:-none}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: e2e/checkout-mattermost-plugin-calls-repo
        uses: actions/checkout@v4

      # Compose IMAGE_SERVER from the pinned tag here: the `env` context can't be
      # referenced inside a job-level `env:` block, so we build it via $GITHUB_ENV.
      - name: e2e/set-server-image
        run: echo "IMAGE_SERVER=mattermostdevelopment/mattermost-enterprise-fips-edition:${MM_SERVER_IMAGE_TAG}" >> "${GITHUB_ENV}"

      - name: e2e/checkout-mattermost-repo
        uses: actions/checkout@v4
        with:
          repository: mattermost/mattermost
          # Must match IMAGE_SERVER's tag: this checkout only feeds config
          # generation, so a mismatch would generate config against the wrong
          # server version.
          ref: ${{ env.MM_SERVER_IMAGE_TAG }}
          path: mattermost

      - name: e2e/setup-docker-buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: e2e/setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: mattermost/server/go.mod

      - name: e2e/generate-configuration
        working-directory: ./mattermost/server
        env:
          OUTPUT_CONFIG: ${{ github.workspace }}/config/config.json
        run: |
          go work init . ./public
          mkdir -p ${{ github.workspace }}/config
          cd scripts/config_generator
          go run main.go

      - name: e2e/download-mattermost-plugin-calls-package-fips
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: mattermost-plugin-calls-package-fips
          path: dist

      - name: e2e/docker-login
        uses: docker/login-action@0d4c9c5ea7693da7b068278f7b52bda2a190a446 # v3.2.0
        with:
          username: ${{ secrets.DOCKERHUB_DEV_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DEV_TOKEN }}

      - name: e2e/chainguard-login
        uses: chainguard-dev/setup-chainctl@67a753db49c7e97fed4c76fbe809b1339b11facf
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: e2e/run-server
        env:
          DOCKER_CLIENT_TIMEOUT: 120
          COMPOSE_HTTP_TIMEOUT: 120
          DOCKER_COMPOSE_FILE: ${{ github.workspace }}/e2e/docker/docker-compose.yaml
          MM_PLUGIN_CALLS_TEST_LICENSE: ${{ secrets.MM_PLUGIN_CALLS_TEST_LICENSE }}
        run: |
          ${{ github.workspace }}/e2e/scripts/prepare-server.sh

      - name: e2e/build-e2e-image
        working-directory: e2e
        run: |
          echo "Building playwright test image ... "
          cp ${{ github.workspace }}/plugin.json plugin.json
          docker build --quiet -t mm-playwright -f Playwright.Dockerfile .

      - name: e2e/test
        env:
          WORKSPACE: ${{github.workspace}}
          RUN_ID: ${{matrix.run_id}}
        id: test
        run: |
          ${{ github.workspace }}/e2e/scripts/run.sh

      # Artifact names must not match generate-e2e-report.yml's
      # e2e-playwright-results-* pattern, or these results land in the main report.
      - name: e2e/persist-report-results
        if: always()
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: e2e-fips-playwright-results-${{ matrix.run_id }}
          path: ${{ github.workspace }}/results
          compression-level: 0
          retention-days: 1

      - name: e2e/persist-report-logs
        if: ${{ always() && fromJson(steps.test.outputs.FAILURES || '0') > 0 }}
        uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
        with:
          name: e2e-fips-playwright-logs-${{ matrix.run_id }}
          path: ${{ github.workspace }}/logs
          compression-level: 0
          retention-days: 5
