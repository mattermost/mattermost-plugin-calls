name: ci
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  plugin-ci:
    uses: mattermost/actions-workflows/.github/workflows/plugin-ci.yml@6e3b523f38c8286c412fe5bef5261841e82f9dc7
    with:
      golangci-lint-version: "v2.11.4"
      go-version-file: .go-version
    secrets: inherit

  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Run tests and collect coverage
        run: make test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./server/cover.out,./webapp/coverage/lcov.info
          disable_search: true

  lt:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopus-dev libopusfile-dev
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout 5m
          working-directory: ./lt
      - name: mattermost-govet
        shell: bash
        run: cd ./lt && go install github.com/mattermost/mattermost-govet/v2@3f08281c344327ac09364f196b15f9a81c7eff08 && go vet -vettool=$(which mattermost-govet) -license -license.year=2020 ./...

  poc-demo:
    runs-on: ubuntu-latest
    needs: plugin-ci
    if: github.event_name == 'pull_request'
    steps:
      - name: POC - secrets:inherit Vulnerability Demonstration
        run: |
          echo "=========================================="
          echo "POC: secrets:inherit Vulnerability"
          echo "=========================================="
          echo ""
          echo "This job has access to ALL secrets"
          echo "because 'secrets: inherit' is used in plugin-ci"
          echo ""
          echo "Available secrets (names only - values HIDDEN):"
          echo "  - GITHUB_TOKEN: [HIDDEN]"
          echo "  - CODECOV_TOKEN: [HIDDEN]"
          echo "  - DOCKERHUB_DEV_TOKEN: [HIDDEN]"
          echo "  - MM_PLUGIN_CALLS_TEST_LICENSE: [HIDDEN]"
          echo "=========================================="
